services:
  - type: web
    name: khodal-office-hub
    env: python
    region: oregon
    plan: starter # Starter plan allows persistent disk; change to 'free' if testing without disk
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app:app --host 0.0.0.0 --port $PORT
    disk:
      name: khodal-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.0
      - key: DATA_DIR
        value: /var/data
      - key: ENVIRONMENT
        value: production
