services:
  - type: web
    name: khodal-office-hub
    env: python
    region: oregon
    plan: free # 100% Free plan with zero credit card needed
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.0
      - key: ENVIRONMENT
        value: production
      - key: MONGODB_URI
        sync: false # Set in Render Dashboard with your actual MongoDB Atlas password
      - key: MONGODB_DB_NAME
        value: khodal_office
